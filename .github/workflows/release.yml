name: Publish release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and validate installable archive
        run: python3 scripts/package_release.py --tag "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/HunterFocusArc-$GITHUB_REF_NAME.zip" \
            "dist/HunterFocusArc-$GITHUB_REF_NAME.zip.sha256" \
            --verify-tag --generate-notes --title "Hunter Focus Arc $GITHUB_REF_NAME"
